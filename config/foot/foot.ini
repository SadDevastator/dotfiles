[main]
include=~/.config/foot/themes/noctalia

shell=zsh
title=foot
font=FiraCode Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[colors-dark]
alpha=0.78
blur=yes

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f
# Free Ctrl+Shift+Z for yazi's zoxide jump (default here is prompt-prev)
prompt-prev=none

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
